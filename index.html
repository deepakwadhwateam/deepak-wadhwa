.title{

}

.join-btn:focus-visible,
.bottom-ad a:focus-visible{

outline-offset:4px;
}

.features{

.bottom-ad{
margin-top:15px;

border-radius:10px;
background:linear-gradient(135deg,#4f46e5,#9333ea,#ec4899);
box-shadow:0 0 10px rgba(236,72,153,0.5);
animation:glow 2s infinite alternate;
}

.bottom-ad a{
color:#fff;
font-weight:600;
text-decoration:none;
}

.bottom-ad span{
color:#89fff2;
}

@keyframes glow{
from{
box-shadow:0 0 5px rgba(236,72,153,0.35);
}
to{
box-shadow:0 0 16px rgba(236,72,153,0.8);
}
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.06);}
100%{transform:scale(1);}
}

@keyframes blink{
0%{opacity:1;}
50%{opacity:0.92;}
100%{opacity:1;}
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:480px){

.telegram-card{
padding:30px 18px;
border-radius:28px;
}

.title{
font-size:26px;
}

.join-btn{
font-size:18px;
padding:18px 10px;

.features p{
font-size:16px;
}

.bottom-ad{
font-size:16px;
}

.profile-img{
width:95px;
height:95px;
}

}

@media(prefers-reduced-motion:reduce){
.join-btn{
transition:none;
}

.bottom-ad{
animation:none;
}
